<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据与模型六页原型</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;font:14px 'Microsoft YaHei',sans-serif;color:#181818}main{max-width:1200px;margin:32px auto}h1{font-size:28px}h2{font-size:18px;margin:0}header,.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.tabs,.panel,.summary{background:white;border:1px solid #e5e7eb;margin-bottom:24px}.tabs{display:flex}.tabs button{flex:1;height:54px;border:0;border-bottom:3px solid transparent;background:white;color:#555;font:inherit;cursor:pointer}.tabs button.active{color:#0052d9;border-bottom-color:#0052d9}.bar{padding:24px;margin:0}button,select{border:1px solid #dcdcdc;border-radius:0;background:white;padding:8px 16px;color:inherit;font:inherit}.primary{background:#0052d9;color:white;border-color:#0052d9}table{border-collapse:collapse;width:100%;table-layout:fixed}th{background:#f3f5f8;color:#64748b;font-size:12px;font-weight:400}th,td{text-align:left;padding:22px 18px;border-bottom:1px solid #e7e9ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.summary{display:flex;padding:26px}.summary>div{flex:1;border-right:1px solid #e5e7eb;padding:0 20px}.summary>div:last-child{border:0}.summary span{color:#64748b;font-size:12px;display:block}.summary strong{font-size:32px;display:block;margin-top:8px}.meta{font-size:12px;color:#777;margin:12px 0}.empty{text-align:center;color:#888;padding:60px}a{color:#0052d9}.screen[hidden]{display:none}@media(max-width:700px){main{margin:16px}.tabs{overflow:auto}.tabs button{min-width:130px}.panel{overflow:auto}table{min-width:800px}}</style><main><div class="meta">设计原型 · 空状态 · 实际数字由 v2 workspace 接口读取</div><header><h1>数据与模型</h1><div><select><option>日职</option><option>韩职</option><option>亚冠精英</option></select> <button>刷新状态</button></div></header><nav class="tabs"><button class="active" onclick="show(0)">赛事 div><table><tr><th>模型</th><th>版本</th><th>状态</th><th>训练时间</th><th>操作</th></tr><tr><td colspan="5" class="empty">暂无记录</td></tr></table></div></section><dialog><h2>新建任务</h2><p><select><option>单算法拟合</option><option>固定模型评估</option><option>滚动实验</option></select></p><p>数据版本 <input></p><p>算法 <select><option>攻防泊松</option></select></p><button onclick="this.closest('dialog').close()">关闭</button></dialog><script>function show(i){document.querySelectorAll('.screen').forEach((s,n)=>s.hidden=n!==i);document.querySelectorAll('.tabs button').forEach((s,n)=>s.classList.toggle('active',n===i))}</script></main></html>
